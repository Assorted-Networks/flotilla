[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flotilla"
version = "0.1.0"
description = "Run many small LLMs across several Linux machines as one team"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.scripts]
flotilla = "flotilla.cli:main"

[tool.setuptools.packages.find]
include = ["flotilla*"]

[tool.setuptools.package-data]
flotilla = ["static/*.html"]
